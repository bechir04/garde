version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: garde_national
      POSTGRES_USER: gn_user
      POSTGRES_PASSWORD: gn_password_2024
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
